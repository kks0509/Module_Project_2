services:
  db:
    image: mysql:8.4
    container_name: lms-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lms
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: lmspass
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lms-network

  lms:
    build: ./lms
    container_name: lms-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: lms
      DB_USER: lms_user
      DB_PASSWORD: lmspass

      LAB_SQLI_LOGIN: "true"
      LAB_SQLI_STUDENT_SEARCH: "true"
      LAB_BAC_ADMIN: "true"
    depends_on:
      - db
    ports:
      - "127.0.0.1:5000:5000"
      - "10.163.130.121:5000:5000"
    networks:
      - lms-network
  nginx:
    image: nginx:alpine
    container_name: lms-proxy
    restart: unless-stopped
    depends_on:
      - lms
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - lms-network

volumes:
  db_data:

networks:
  lms-network:
