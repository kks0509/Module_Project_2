<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LMS 로그인</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #111827 0%,
                    #1f2937 55%,
                    #374151 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 980px;
            min-height: 560px;

            display: grid;
            grid-template-columns: 1.1fr 0.9fr;

            background: white;
            border-radius: 18px;
            overflow: hidden;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.28);
        }

        /* 왼쪽 소개 영역 */

        .intro {
            background:
                linear-gradient(
                    145deg,
                    #111827,
                    #243247
                );

            color: white;
            padding: 60px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;
            background: rgba(255,255,255,0.12);

            font-size: 20px;
            font-weight: 700;
        }

        .brand-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .intro-content {
            margin: auto 0;
        }

        .intro-content h1 {
            font-size: 40px;
            line-height: 1.3;
            margin-bottom: 22px;
            letter-spacing: -1.5px;
        }

        .intro-content p {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.8;
        }

        .intro-footer {
            color: #94a3b8;
            font-size: 13px;
        }

        /* 로그인 영역 */

        .login-section {
            padding: 60px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            margin-bottom: 36px;
        }

        .login-header h2 {
            color: #111827;
            font-size: 30px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .login-header p {
            color: #6b7280;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            font-size: 15px;
            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #374151;

            box-shadow:
                0 0 0 3px rgba(55, 65, 81, 0.12);
        }

        .login-button {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 9px;

            background: #1f2937;
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;

            margin-top: 8px;
        }

        .login-button:hover {
            background: #111827;
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .error-message {
            margin-bottom: 20px;
            padding: 13px 15px;

            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;

            color: #b91c1c;
            font-size: 14px;
        }

        .notice {
            margin-top: 28px;
            padding-top: 22px;

            border-top: 1px solid #e5e7eb;

            color: #9ca3af;
            font-size: 12px;
            line-height: 1.7;
            text-align: center;
        }

        /* 모바일 */

        @media (max-width: 800px) {

            .login-wrapper {
                grid-template-columns: 1fr;
                max-width: 480px;
            }

            .intro {
                padding: 35px;
                min-height: 230px;
            }

            .intro-content {
                margin-top: 45px;
            }

            .intro-content h1 {
                font-size: 28px;
            }

            .intro-content p,
            .intro-footer {
                display: none;
            }

            .login-section {
                padding: 40px 35px;
            }
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <!-- 왼쪽 LMS 소개 -->

    <section class="intro">

        <div class="brand">
            <div class="brand-logo">
                L
            </div>

            <div class="brand-text">
                LMS
            </div>
        </div>

        <div class="intro-content">

            <h1>
                Learning<br>
                Management System
            </h1>

            <p>
                강의와 성적, 학습 정보를 한 곳에서 관리하는
                통합 학습관리시스템입니다.
            </p>

        </div>

        <div class="intro-footer">
            LMS Security Lab
        </div>

    </section>


    <!-- 오른쪽 로그인 -->

    <section class="login-section">

        <div class="login-header">

            <h2>로그인</h2>

            <p>
                LMS 계정으로 로그인해 주세요.
            </p>

        </div>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" action="/login">

            <div class="form-group">

                <label for="username">
                    아이디
                </label>

                <input
                    id="username"
                    class="form-control"
                    type="text"
                    name="username"
                    placeholder="아이디를 입력하세요"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    비밀번호
                </label>

                <input
                    id="password"
                    class="form-control"
                    type="password"
                    name="password"
                    placeholder="비밀번호를 입력하세요"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                로그인
            </button>

        </form>


        <div class="notice">
            본 시스템은 LMS 보안 취약점 분석 및 교육을 위한
            실습 환경입니다.
        </div>

    </section>

</div>

</body>
</html>
