<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LMS{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                Arial,
                sans-serif;

            background: #f3f6fb;
            color: #1f2937;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           사이드바
        ========================= */

        .sidebar {
            width: 250px;

            background:
                linear-gradient(
                    180deg,
                    #172554 0%,
                    #1e3a8a 100%
                );

            color: white;

            padding: 28px 20px;

            display: flex;
            flex-direction: column;

            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .brand {
            margin-bottom: 32px;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand p {
            margin-top: 6px;

            color: #bfdbfe;
            font-size: 13px;
        }

        .menu-title {
            margin: 20px 0 10px;

            color: #93c5fd;

            font-size: 12px;

            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-links a {
            display: block;

            padding: 12px 14px;

            border-radius: 10px;

            color: #e0e7ff;

            text-decoration: none;
            font-size: 15px;

            transition:
                background 0.2s,
                transform 0.1s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.10);
        }

        .logout-link {
            margin-top: auto;

            padding: 12px 14px;

            background: rgba(255,255,255,0.10);

            border-radius: 10px;

            color: white;

            text-decoration: none;

            font-size: 15px;
        }

        .logout-link:hover {
            background: rgba(255,255,255,0.16);
        }

        /* =========================
           메인
        ========================= */

        .main {
            margin-left: 250px;

            flex: 1;

            min-width: 0;
        }

        .topbar {
            height: 76px;

            background: white;

            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 32px;

            position: sticky;
            top: 0;

            z-index: 10;
        }

        .topbar h2 {
            color: #111827;

            font-size: 24px;
            font-weight: 800;

            letter-spacing: -0.7px;
        }

        .student-badge {
            padding: 8px 12px;

            border-radius: 999px;

            background: #eff6ff;
            color: #1d4ed8;

            font-size: 13px;
            font-weight: 700;
        }

        .content {
            padding: 32px;
        }

        .page-title {
            margin-bottom: 24px;
        }

        .page-title h3 {
            color: #111827;

            font-size: 30px;
            font-weight: 800;

            letter-spacing: -1px;
        }

        .page-title p {
            margin-top: 8px;

            color: #6b7280;

            font-size: 14px;
        }

        /* =========================
           카드
        ========================= */

        .card {
            background: white;

            border: 1px solid #eef2f7;
            border-radius: 18px;

            padding: 24px;

            box-shadow:
                0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 28px;
        }

        .stat-card {
            background: white;

            border: 1px solid #eef2f7;
            border-radius: 18px;

            padding: 24px;

            box-shadow:
                0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .stat-card .label {
            margin-bottom: 12px;

            color: #6b7280;

            font-size: 14px;
            font-weight: 600;
        }

        .stat-card .value {
            color: #111827;

            font-size: 30px;
            font-weight: 800;
        }

        .stat-card .sub {
            margin-top: 10px;

            color: #94a3b8;

            font-size: 13px;
        }

        .two-column {
            display: grid;

            grid-template-columns:
                1.3fr 1fr;

            gap: 20px;
        }

        .section-title {
            margin-bottom: 16px;

            color: #111827;

            font-size: 18px;
            font-weight: 700;
        }

        /* =========================
           표
        ========================= */

        table {
            width: 100%;

            background: white;

            border-collapse: collapse;

            border-radius: 16px;

            overflow: hidden;
        }

        th {
            padding: 14px 16px;

            background: #f8fafc;

            border-bottom:
                1px solid #e5e7eb;

            color: #475569;

            text-align: left;

            font-size: 14px;
            font-weight: 700;
        }

        td {
            padding: 14px 16px;

            border-bottom:
                1px solid #eef2f7;

            color: #1f2937;

            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* =========================
           입력 / 버튼
        ========================= */

        input,
        select {
            width: 100%;

            padding: 11px 13px;

            border:
                1px solid #d1d5db;

            border-radius: 10px;

            font-size: 14px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        button {
            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: #2563eb;
            color: white;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .notice-item {
            padding: 14px 0;

            border-bottom:
                1px solid #eef2f7;
        }

        .notice-item:last-child {
            border-bottom: none;
        }

        .notice-title {
            color: #1f2937;

            font-size: 14px;
            font-weight: 600;
        }

        .quick-links {
            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .quick-link {
            display: block;

            padding: 14px 16px;

            background: #f8fafc;

            border:
                1px solid #e5e7eb;

            border-radius: 12px;

            color: #1f2937;

            text-decoration: none;

            font-weight: 600;
        }

        .quick-link:hover {
            background: #eff6ff;

            border-color: #bfdbfe;
        }

        /* =========================
           반응형
        ========================= */

        @media (max-width: 1000px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .two-column {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 800px) {
            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
            }

            .content,
            .topbar {
                padding-left: 18px;
                padding-right: 18px;
            }
        }
    </style>

</head>

<body>

<div class="layout">

    <!-- 사이드바 -->

    <aside class="sidebar">

        <div class="brand">

            <h1>LMS</h1>

            <p>
                Learning Management System
            </p>

        </div>


        <div class="menu-title">
            Student Menu
        </div>


        <nav class="nav-links">

            <a href="/student">
                Dashboard
            </a>

            <a href="/student/profile">
                내 정보
            </a>

            <a href="/student/grades">
                성적 조회
            </a>

            <a href="/student/courses">
                강의 검색
            </a>

            <a href="/student/notices">
                공지사항
            </a>

        </nav>


        <a
            href="/logout"
            class="logout-link"
        >
            로그아웃
        </a>

    </aside>


    <!-- 메인 -->

    <main class="main">

        <header class="topbar">

            <h2>
                {% block page_header %}
                LMS
                {% endblock %}
            </h2>

            <div class="student-badge">
                STUDENT
            </div>

        </header>


        <div class="content">

            {% block content %}
            {% endblock %}

        </div>

    </main>

</div>

</body>
</html>
