<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LMS 관리자{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans KR",
                Arial,
                sans-serif;
            background: #f3f6fb;
            color: #1f2937;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* 사이드바 */

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
        }

        .brand {
            margin-bottom: 32px;
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 6px;
        }

        .brand p {
            font-size: 13px;
            color: #cbd5e1;
        }

        .menu-title {
            font-size: 12px;
            color: #94a3b8;
            margin: 20px 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-links a {
            display: block;
            text-decoration: none;
            color: #e5e7eb;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 15px;
            transition: background 0.2s, transform 0.1s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.08);
        }

        .logout-link {
            margin-top: auto;
            background: rgba(255,255,255,0.08);
        }

        /* 메인 */

        .main {
            margin-left: 250px;
            flex: 1;
            min-width: 0;
        }

        .topbar {
            height: 76px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar h2 {
            font-size: 24px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.7px;
        }

        .admin-badge {
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 999px;
        }

        .content {
            padding: 32px;
        }

        .page-title {
            margin-bottom: 24px;
        }

        .page-title h3 {
            font-size: 30px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -1px;
        }

        .page-title p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        /* 공통 카드 */

        .card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            border: 1px solid #eef2f7;
        }

        /* 대시보드 카드 grid */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            border: 1px solid #eef2f7;
        }

        .stat-card .label {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 34px;
            font-weight: 800;
            color: #111827;
            line-height: 1;
        }

        .stat-card .sub {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #111827;
        }

        /* 표 */

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }

        th {
            background: #f8fafc;
            color: #475569;
            text-align: left;
            font-size: 14px;
            font-weight: 700;
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #eef2f7;
            font-size: 14px;
            color: #1f2937;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* 버튼/입력 */

        input,
        select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn {
            display: inline-block;
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            background: #1d4ed8;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background: #1e40af;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #1f2937;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quick-link {
            display: block;
            text-decoration: none;
            color: #1f2937;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 14px 16px;
            font-weight: 600;
        }

        .quick-link:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        @media (max-width: 1100px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .two-column {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 800px) {
            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
            }

            .topbar,
            .content {
                padding-left: 18px;
                padding-right: 18px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .topbar h2 {
                font-size: 20px;
            }

            .page-title h3 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="brand">
            <h1>LMS 관리자</h1>
            <p>Learning Management System</p>
        </div>

        <div class="menu-title">Main Menu</div>
        <nav class="nav-links">
            <a href="/admin">Dashboard</a>
            <a href="/admin/students">학생 관리</a>
            <a href="/admin/grades">성적 관리</a>
            <a href="/admin/courses">강의 관리</a>
        </nav>

        <a href="/logout" class="nav-links logout-link" style="padding:12px 14px; text-decoration:none; color:#fff; border-radius:10px;">
            로그아웃
        </a>
    </aside>

    <main class="main">
        <header class="topbar">
            <h2>{% block page_header %}관리자 페이지{% endblock %}</h2>
            <div class="admin-badge">ADMIN</div>
        </header>

        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </main>

</div>

</body>
</html>
