{% extends "base.html" %}

{% block title %}
공지사항
{% endblock %}

{% block page_header %}
공지사항
{% endblock %}

{% block content %}

<div class="page-title">

    <h3>공지사항</h3>

    <p>
        LMS의 주요 공지 내용을 확인합니다.
    </p>

</div>


{% for notice in notices %}

<div class="card"
     style="margin-bottom:16px;">

    <h3 style="
        margin-bottom:12px;
        color:#111827;
        font-size:18px;
    ">
        {{ notice.title }}
    </h3>

    <p style="
        color:#4b5563;
        line-height:1.8;
        margin-bottom:16px;
    ">
        {{ notice.content }}
    </p>

    <small style="color:#94a3b8;">
        {{ notice.created_at }}
    </small>

</div>

{% endfor %}

{% endblock %}
